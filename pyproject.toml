[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-carma"
version = "0.1.0"
description = "External orchestration for four preserved CARMA PDE implementations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pde-carma = "pde_carma.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

